<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8-Bit Machinery</title>
<style>
  :root {
    --bg: #000;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @font-face {
    font-family: 'Press Start 2P';
    font-style: normal;
    font-weight: 400;
    src: local('Press Start 2P'), local('PressStart2P-Regular'), url(font.woff) format('woff');
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; } }
  :root[data-theme="dark"] { --bg: #000; }
  html { height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { height: 100%; margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="screen" role="img" aria-label="Animated 8-Bit Machinery logo with starfield and scroller">
  Your browser does not support HTML5 canvas.
</canvas>

<script>
(function () {
  var FONT = '"Press Start 2P", "Courier New", monospace';
  var canvas = document.getElementById('screen');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w = 0, h = 0;

  function resize() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v) { return Math.max(0, Math.min(1, v)); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function easeOutBack(p) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  }

  // ---------- Sound: a tiny chiptune synth ----------
  var audio = { ctx: null, master: null, noise: null, muted: false, seq: null };
  var VOLUME = 0.16;

  function initAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || audio.ctx) return;
    try { audio.ctx = new AC(); } catch (e) { return; }
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = VOLUME;
    audio.master.connect(audio.ctx.destination);
    var len = audio.ctx.sampleRate;
    var buf = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    audio.noise = buf;
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
  }

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function tone(type, f, t, dur, vol, f2) {
    if (!audio.ctx) return;
    var c = audio.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function hiss(t, dur, vol, hp) {
    if (!audio.ctx) return;
    var c = audio.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = audio.noise;
    f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(audio.master);
    s.start(t); s.stop(t + dur + 0.02);
  }

  function powerDown() { if (audio.ctx) tone('triangle', 880, audio.ctx.currentTime, 2.4, 0.3, 55); }
  function bleep(n) { if (audio.ctx) tone('square', [523, 659, 784, 1047][n] || 1047, audio.ctx.currentTime, 0.09, 0.25); }

  function startMusic() {
    if (!audio.ctx || audio.seq) return;
    var stepDur = 60 / 140 / 4;
    var next = audio.ctx.currentTime + 0.1;
    var step = 0;
    // Am, F, C, G
    var prog = [[45, [0, 3, 7]], [41, [0, 4, 7]], [48, [0, 4, 7]], [43, [0, 4, 7]]];

    function schedule(s, t) {
      var bar = Math.floor(s / 16) % 4, i = s % 16;
      var root = prog[bar][0], chord = prog[bar][1];
      if (i % 2 === 0) tone('square', mtof(root - 12 + (i % 4 === 2 ? 12 : 0)), t, stepDur * 1.6, 0.18);
      for (var k = 0; k < 2; k++) {
        var n = (i * 2 + k) % 3;
        tone('square', mtof(root + 24 + chord[n]), t + k * stepDur / 2, stepDur / 2 * 0.9, 0.07);
      }
      if (i === 0 || i === 8 || (i === 10 && bar === 3)) tone('sine', 150, t, 0.25, 0.5, 40);
      if (i === 4 || i === 12) hiss(t, 0.18, 0.35, 1500);
      if (i % 2 === 1) hiss(t, 0.04, 0.12, 7000);
    }

    audio.seq = setInterval(function () {
      while (next < audio.ctx.currentTime + 0.15) {
        schedule(step, next);
        next += stepDur;
        step++;
      }
    }, 30);
  }

  var toast = { text: '', t: 0 };
  function toggleMute() {
    if (!audio.ctx) return;
    audio.muted = !audio.muted;
    audio.master.gain.setTargetAtTime(audio.muted ? 0 : VOLUME, audio.ctx.currentTime, 0.02);
    toast.text = audio.muted ? 'sound off' : 'sound on';
    toast.t = 1.2;
  }

  // ---------- Stages (same pattern as the original: each returns the next) ----------
  function pressStart() {
    var t = 0;
    var s = function (ctx, w, h, dt) {
      t += dt;
      var size = Math.max(10, Math.min(24, Math.floor(w * 0.8 / 11)));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (Math.floor(t * 1.6) % 2 === 0) {
        ctx.font = size + 'px ' + FONT;
        ctx.fillStyle = '#fff';
        ctx.fillText('press start', w / 2, h / 2);
      }
      ctx.font = Math.max(8, Math.round(size * 0.5)) + 'px ' + FONT;
      ctx.fillStyle = '#777';
      ctx.fillText('(sound on)', w / 2, h / 2 + size * 2);
      ctx.textAlign = 'left';
      return s;
    };
    return s;
  }

  function fade() {
    var color = 255, first = true;
    var s = function (ctx, w, h, dt) {
      if (first) { powerDown(); first = false; }
      color = Math.max(0, color - 100 * dt);
      var c = Math.floor(color);
      ctx.fillStyle = 'rgb(' + c + ',' + c + ',' + c + ')';
      ctx.fillRect(0, 0, w, h);
      return color === 0 ? chill(0.25, flash()) : s;
    };
    return s;
  }

  function flash(remaining) {
    var iterations = remaining || 4;
    var color = 255, first = true;
    var s = function (ctx, w, h, dt) {
      if (first) { bleep(4 - iterations); first = false; }
      color = Math.max(0, color - 2000 * dt);
      var c = Math.floor(color);
      ctx.fillStyle = 'rgb(' + c + ',' + c + ',' + c + ')';
      ctx.fillRect(0, 0, w, h);
      if (color !== 0) return s;
      return --iterations === 0 ? logo() : chill(0.015, flash(iterations));
    };
    return s;
  }

  function chill(seconds, next) {
    var remaining = seconds;
    var s = function (ctx, w, h, dt) {
      remaining -= dt;
      return remaining < 0 ? next : s;
    };
    return s;
  }

  function newStar(anyDepth) {
    return { x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: anyDepth ? 0.05 + Math.random() * 0.95 : 1 };
  }

  var SCROLL =
    '8-Bit Machinery proudly presents... absolutely nothing, at sixty frames per second.     ' +
    'Original code by Lars, remixed by Claude Opus 5.5 on its first day out.     ' +
    'Tap anywhere to mute.     ' +
    'Wrapping around in 3... 2... 1...          ';

  function logo() {
    var msg = '8-Bit Machinery';
    var t = 0, scrollX = null;
    var amp = reduceMotion ? 0.3 : 1;
    var stars = [];
    for (var i = 0; i < 220; i++) stars.push(newStar(true));
    startMusic();

    function drawStars(ctx, w, h, dt, speed) {
      var cx = w / 2, cy = h / 2, scale = Math.max(w, h) * 0.5;
      ctx.lineCap = 'round';
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i], pz = st.z;
        st.z -= speed * dt;
        if (st.z <= 0.02) { stars[i] = newStar(false); continue; }
        var x1 = cx + st.x / pz * scale, y1 = cy + st.y / pz * scale;
        var x2 = cx + st.x / st.z * scale, y2 = cy + st.y / st.z * scale;
        if (x2 < -50 || x2 > w + 50 || y2 < -50 || y2 > h + 50) { stars[i] = newStar(false); continue; }
        var a = Math.min(1, (1 - st.z) * 1.3);
        ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
        ctx.lineWidth = (1 - st.z) * 2.5 + 0.5;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }

    function drawCopper(ctx, w, h, cy, size) {
      var alpha = Math.min(1, t / 1.2) * 0.55;
      for (var k = 0; k < 3; k++) {
        var y = cy + Math.sin(t * 1.6 + k * 1.05) * Math.max(size * 2.2, h * 0.16) * amp;
        var bh = size * 1.1;
        var hue = mod(k * 110 + t * 25, 360);
        var g = ctx.createLinearGradient(0, y - bh / 2, 0, y + bh / 2);
        g.addColorStop(0, 'hsla(' + hue + ',90%,15%,0)');
        g.addColorStop(0.5, 'hsla(' + hue + ',95%,60%,1)');
        g.addColorStop(1, 'hsla(' + hue + ',90%,15%,0)');
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
        ctx.fillRect(0, y - bh / 2, w, bh);
      }
      ctx.globalAlpha = 1;
    }

    function drawLogo(ctx, w, h, cy, size) {
      ctx.font = size + 'px ' + FONT;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      var cw = ctx.measureText('M').width;
      var x0 = (w - cw * msg.length) / 2;
      var wobbleIn = Math.min(1, Math.max(0, t - 1.5));
      for (var i = 0; i < msg.length; i++) {
        var ch = msg[i];
        if (ch === ' ') continue;
        var p = clamp((t - 0.15 - i * 0.07) / 0.55);
        if (p <= 0) continue;
        var drop = (1 - easeOutBack(p)) * (cy + size);
        var wob = Math.sin(t * 2.8 + i * 0.5) * size * 0.35 * amp * wobbleIn;
        var x = x0 + i * cw, y = cy - drop + wob;
        ctx.fillStyle = '#240046';
        ctx.fillText(ch, x + size * 0.1, y + size * 0.1);
        ctx.fillStyle = 'hsl(' + mod(i * 22 - t * 120, 360) + ',100%,62%)';
        ctx.fillText(ch, x, y);
      }
    }

    function drawScroller(ctx, w, h, dt, size) {
      var ss = Math.max(10, Math.round(size * 0.42));
      ctx.font = ss + 'px ' + FONT;
      var cw = ctx.measureText('M').width;
      if (scrollX === null) scrollX = w;
      scrollX -= Math.max(90, w * 0.12) * dt;
      if (scrollX + SCROLL.length * cw < 0) scrollX = w;
      var by = h * 0.84;
      var first = Math.max(0, Math.floor(-scrollX / cw));
      var last = Math.min(SCROLL.length, Math.ceil((w - scrollX) / cw));
      for (var i = first; i < last; i++) {
        var x = scrollX + i * cw;
        var y = by + Math.sin(t * 3.5 + x * 0.018) * ss * 1.2 * amp;
        ctx.fillStyle = 'hsl(' + mod(x * 0.4 + t * 60, 360) + ',85%,78%)';
        ctx.fillText(SCROLL[i], x, y);
      }
    }

    var s = function (ctx, w, h, dt) {
      t += dt;
      var size = Math.max(14, Math.min(56, Math.floor(w * 0.9 / msg.length)));
      var cy = h * 0.42;
      var warp = reduceMotion ? 0 : Math.max(0, 1.6 - t) * 2.2;
      drawStars(ctx, w, h, dt, (reduceMotion ? 0.06 : 0.18) + warp);
      drawCopper(ctx, w, h, cy, size);
      drawLogo(ctx, w, h, cy, size);
      if (t > 3) drawScroller(ctx, w, h, dt, size);
      return s;
    };
    return s;
  }

  // ---------- Main loop ----------
  var stage = pressStart();
  var started = false;

  function onInput(e) {
    if (!started) {
      started = true;
      initAudio();
      stage = reduceMotion ? chill(0.4, logo()) : fade();
      return;
    }
    if (e.type === 'keydown' && e.key && e.key.toLowerCase() !== 'm') return;
    toggleMute();
  }
  window.addEventListener('pointerdown', onInput);
  window.addEventListener('keydown', onInput);

  function drawToast(dt) {
    if (toast.t <= 0) return;
    toast.t -= dt;
    ctx.globalAlpha = Math.min(1, toast.t * 3);
    ctx.font = '12px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(toast.text, w / 2, 28);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    stage = stage(ctx, w, h, dt);
    drawToast(dt);
    requestAnimationFrame(loop);
  }

  var fontReady = (document.fonts && document.fonts.load)
    ? document.fonts.load('24px "Press Start 2P"').catch(function () {})
    : Promise.resolve();
  var timeout = new Promise(function (r) { setTimeout(r, 2500); });
  Promise.race([fontReady, timeout]).then(function () {
    last = performance.now();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
